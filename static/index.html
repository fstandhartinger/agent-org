<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Org</title>
<style>
:root{--bg:#0e1116;--panel:#161b23;--line:#252c37;--ink:#e8ecf2;--mut:#8b93a3;
 --moss:#63d297;--amber:#f5a524;--violet:#a78bfa;--blue:#5aa9e6;--red:#f26d6d}
*{box-sizing:border-box}
/* the UA rule [hidden]{display:none} loses to any ID selector that sets
   display (e.g. #term{display:flex}), so the panel stayed on screen.
   Re-assert it with enough weight to beat every rule in this file. */
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:9;background:rgba(14,17,22,.95);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line);padding:12px 16px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:17px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.dot.on{background:var(--moss);box-shadow:0 0 0 0 rgba(99,210,151,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(99,210,151,0)}100%{box-shadow:0 0 0 0 rgba(99,210,151,0)}}
.ctrls{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tg{font:inherit;font-size:12px;padding:5px 11px;border-radius:20px;cursor:pointer;
 background:#1a212b;color:var(--mut);border:1px solid var(--line)}
.tg.on{background:#22303f;color:var(--ink);border-color:#38506a}
main{padding:14px 12px 70px;max-width:1180px;margin:0 auto}
.dept{margin:20px 0 9px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
 color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}
.card.sub{margin-left:20px;border-left:3px solid #2f3a49}
.row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.name{font-weight:650}
.role{color:var(--mut);font-size:13px}
.desc{color:#aab2c0;font-size:13px;margin-top:5px}
.meta{color:var(--mut);font-size:12px;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:2px 8px;border-radius:20px;
 border:1px solid currentColor;white-space:nowrap}
.b-live{color:var(--moss)}.b-cron{color:var(--amber)}.b-sub{color:var(--blue)}
.b-inf{color:var(--mut)}.b-spawn{color:var(--violet)}
.acts{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer;
 background:#1e2530;color:var(--ink);border:1px solid var(--line)}
button:hover{background:#26303d}
button.danger{color:var(--red);border-color:#4a2626}
input[type=text],input[type=password]{flex:1;min-width:140px;font:inherit;font-size:13px;padding:6px 10px;
 border-radius:8px;background:#10151c;color:var(--ink);border:1px solid var(--line)}
/* ── org chart: departments are COLUMNS, units stack DOWNWARDS ──
   Die alte Form legte alle ~22 Einheiten einer Ebene nebeneinander → gut
   5000 px breit, keine 400 px hoch. Jetzt begrenzt das Grid die Breite auf
   die Zahl der Abteilungen und die Tiefe waechst nach unten. */
#chart{overflow-x:auto;padding:8px 2px 24px}
.tree{display:flex;flex-direction:column;align-items:center}
.node{background:var(--panel);border:1px solid var(--line);border-radius:10px;
 padding:8px 10px;text-align:center;position:relative;overflow-wrap:anywhere}
.node .nt{font-weight:650;font-size:13px;line-height:1.3}
.node .nr{color:var(--mut);font-size:11.5px;margin-top:2px;line-height:1.3}
.node .nb{margin-top:5px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
/* Badges duerfen im Diagramm umbrechen – mit nowrap ragten lange wie
   "SPAWNS · few · via opencode/codex" seitlich aus dem Kasten heraus. */
.node .badge{white-space:normal;font-size:9.5px;padding:1.5px 6px;max-width:100%;
 border-radius:5px;line-height:1.35}
.node.root{border-color:#3c4a5e;background:#1a222d}
.vline{width:2px;height:16px;background:var(--line)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));
 width:100%;align-items:start;column-gap:0;row-gap:26px;margin-top:14px}
.col{position:relative;padding:0 6px;min-width:0}
.col::before{content:"";position:absolute;top:-14px;left:50%;width:2px;height:14px;background:var(--line)}
.col::after{content:"";position:absolute;top:-14px;left:0;right:0;height:2px;background:var(--line)}
.col.rowstart::after{left:50%}
.col.rowend::after{right:50%}
.col.alone::after{display:none}
/* Umgebrochene Reihen haengen an keiner Sammelschiene – dann lieber gar
   keine Linie als eine, die ins Leere zeigt. */
.col.norail::before,.col.norail::after{display:none}
.chead .nt{font-size:12px;letter-spacing:.4px;text-transform:uppercase}
@media(min-width:601px){.col>.node,.col>.stack{max-width:300px;margin-left:auto;margin-right:auto}}
/* Verzeichnisbaum je Spalte: durchgehende Senkrechte + Stummel je Kasten. */
.stack{position:relative;padding-left:8px;margin-top:12px}
.stack::before{content:"";position:absolute;left:8px;top:-12px;width:2px;height:12px;background:var(--line)}
.leaf{position:relative;padding:0 0 8px 14px}
.leaf::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line)}
.leaf:last-child::before{bottom:auto;height:19px}
.leaf::after{content:"";position:absolute;left:0;top:17px;width:14px;height:2px;background:var(--line)}
.leaf .node{text-align:left}
.leaf .node .nb{justify-content:flex-start}
.leaf .stack{margin-top:8px}
@media(max-width:600px){.card.sub{margin-left:11px}.node{font-size:12.5px}}
.hostbox{border:1px dashed #3a4655;border-radius:14px;padding:10px 12px 4px;margin:14px 0}
.hostbox>.hh{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue);
 margin:-2px 0 8px;font-weight:700}
.hostbox.laptop{border-color:#4a3f5e}.hostbox.laptop>.hh{color:var(--violet)}
#term{position:fixed;inset:auto 0 0 0;height:62vh;background:#0b0f14;border-top:1px solid var(--line);
 z-index:20;display:flex;flex-direction:column}
#term .th{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line)}
#term .tt{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#term .tsub{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){#term .tsub{display:none}}
#term pre{flex:1;margin:0;padding:11px 13px;overflow:auto;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;
 color:#c8d2de;white-space:pre}
#term .ti{display:flex;gap:7px;padding:9px 11px;border-top:1px solid var(--line)}
#gate{padding:44px 18px;max-width:400px;margin:0 auto}
#gate input{width:100%;margin:10px 0}
.err{color:var(--red);font-size:13px;margin-top:8px}
.empty{color:var(--mut);font-size:13px;padding:10px 0}
</style></head><body>
<div id="gate" hidden>
  <h1>Agent Org</h1>
  <p style="color:#8b93a3;font-size:13px">Enter the access token. Stored in this browser only.</p>
  <input type="password" id="tok" placeholder="Token" autocomplete="current-password">
  <button onclick="saveTok()">Open</button>
  <div class="err" id="gerr"></div>
</div>
<div id="app" hidden>
<header>
  <div class="hrow">
    <h1>Agent Org</h1>
    <span class="live"><span class="dot" id="dot"></span><span id="livetxt">connecting…</span></span>
  </div>
  <div class="ctrls">
    <button class="tg on" id="t-list" onclick="setView('list')">List</button>
    <button class="tg" id="t-chart" onclick="setView('chart')">Org chart</button>
    <button class="tg" id="t-sub" onclick="toggleSubs()">Show subagents</button>
    <button class="tg" id="t-rt" onclick="toggleRT()">Live: on</button>
    <button class="tg" id="t-host" onclick="toggleHosts()">System boundaries</button>
  </div>
  <div class="live" id="stamp" style="margin-top:7px"></div>
</header>
<main><div id="out"></div><div id="chart" hidden></div></main>
<div id="term" hidden>
  <div class="th"><span class="tt" id="tname"></span><span class="tsub" id="tsub"></span>
    <span style="flex:1"></span>
    <button onclick="termRefresh()">Refresh</button>
    <button onclick="closeTerm()">Close</button></div>
  <pre id="tout">…</pre>
  <div class="ti"><input type="text" id="tin" placeholder="Type a message and press Enter…"
    onkeydown="if(event.key==='Enter')termSend()">
    <button onclick="termSend()">Send</button></div>
</div>
</div>
<script>
const DEPTS=["Leadership","Production","Distribution","Research","Security","Operations","Unassigned"];
let TOKEN=localStorage.getItem("orgtok")||"", DATA=null, ES=null;
let VIEW=localStorage.getItem("orgview")||"list";
let HOSTS=localStorage.getItem("orghosts")==="1";
let TERM=null, TERMTIMER=null;
let SUBS=localStorage.getItem("orgsubs")==="1";
let RT=localStorage.getItem("orgrt")!=="0";

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=n=>(n||0).toLocaleString("en-US");
function dur(s){if(s==null)return"?";const d=~~(s/86400),h=~~(s%86400/3600),m=~~(s%3600/60);
  return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`}

function saveTok(){TOKEN=document.getElementById("tok").value.trim();
  localStorage.setItem("orgtok",TOKEN);connect()}
function setView(v){VIEW=v;localStorage.setItem("orgview",v);
  document.getElementById("t-list").classList.toggle("on",v==="list");
  document.getElementById("t-chart").classList.toggle("on",v==="chart");
  render()}
function toggleSubs(){SUBS=!SUBS;localStorage.setItem("orgsubs",SUBS?"1":"0");
  document.getElementById("t-sub").classList.toggle("on",SUBS);
  document.getElementById("t-sub").textContent=SUBS?"Hide subagents":"Show subagents";render()}
function toggleHosts(){HOSTS=!HOSTS;localStorage.setItem("orghosts",HOSTS?"1":"0");
  document.getElementById("t-host").classList.toggle("on",HOSTS);render()}

function openTerm(id,name,role){
  TERM={id,name,role};
  document.getElementById("term").hidden=false;
  document.getElementById("tname").textContent=name;
  document.getElementById("tsub").textContent=role||"";
  termRefresh();
  if(TERMTIMER)clearInterval(TERMTIMER);
  TERMTIMER=setInterval(termRefresh,4000);
}
function closeTerm(){document.getElementById("term").hidden=true;
  if(TERMTIMER){clearInterval(TERMTIMER);TERMTIMER=null}TERM=null}
async function termRefresh(){
  if(!TERM)return;
  if(TERM.id==="hermes:gateway"){
    document.getElementById("tout").textContent=
      "Hermes has no terminal pane. Type a message below — it goes straight into his agent loop, "+
      "and his reply appears here.";
    return;
  }
  try{
    const r=await fetch("/api/pane?id="+encodeURIComponent(TERM.id)+"&lines=200",
      {headers:{"X-Org-Token":TOKEN}});
    const d=await r.json();
    const el=document.getElementById("tout");
    const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<40;
    el.textContent=(d.text||"").replace(/\n{3,}/g,"\n\n").trimEnd()||"(pane is empty)";
    if(atBottom)el.scrollTop=el.scrollHeight;
  }catch(e){}
}
async function termSend(){
  const el=document.getElementById("tin"),text=el.value.trim();if(!text||!TERM)return;
  el.value="";el.disabled=true;
  const out=document.getElementById("tout");
  out.textContent+="\n\n> "+text+"\n(sending…)";out.scrollTop=out.scrollHeight;
  const r=await api("/api/prompt",{method:"POST",body:JSON.stringify({id:TERM.id,text})});
  el.disabled=false;el.focus();
  if(r.reply){out.textContent+="\n\n"+r.reply;out.scrollTop=out.scrollHeight}
  else setTimeout(termRefresh,900);
}

function toggleRT(){RT=!RT;localStorage.setItem("orgrt",RT?"1":"0");
  document.getElementById("t-rt").textContent="Live: "+(RT?"on":"off");
  document.getElementById("t-rt").classList.toggle("on",RT);
  if(RT)connect();else{if(ES){ES.close();ES=null}setLive(false,"paused")}}

function setLive(on,txt){document.getElementById("dot").classList.toggle("on",on);
  document.getElementById("livetxt").textContent=txt}

function connect(){
  if(ES){ES.close();ES=null}
  if(!RT){pollOnce();return}
  ES=new EventSource("/api/stream?t="+encodeURIComponent(TOKEN));
  ES.onopen=()=>setLive(true,"live");
  ES.onmessage=e=>{try{DATA=JSON.parse(e.data);gateOff();render()}catch(x){}};
  ES.onerror=()=>{setLive(false,"reconnecting…");
    if(ES&&ES.readyState===2){ES=null;setTimeout(connect,4000)}};
}
async function pollOnce(){
  try{const r=await fetch("/api/org",{headers:{"X-Org-Token":TOKEN}});
    if(r.status===401)throw new Error("401");
    DATA=await r.json();gateOff();render();setLive(false,"paused")}
  catch(e){gateOn()}
}
function gateOn(){document.getElementById("app").hidden=true;
  document.getElementById("gate").hidden=false;
  if(TOKEN)document.getElementById("gerr").textContent="Token rejected."}
function gateOff(){document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false}

function items(){
  if(!DATA)return[];
  const out=[];
  for(const s of DATA.sessions||[])out.push({...s});
  for(const c of DATA.cron||[])out.push({...c});
  for(const h of DATA.hermes||[])out.push({...h,parent:"Hermes"});
  if(DATA.hermes_node)out.push({...DATA.hermes_node});
  for(const l of DATA.laptop||[])out.push({...l});
  for(const it of out){
    if(/Quant research/i.test(it.role||""))it.spawns="many · 6 in parallel";
    else if(/Product cycle|Goal audit|Deputy product owner|Inbox watcher/i.test(it.role||""))
      it.spawns="few · via opencode/codex";
  }
  return out;
}
function badges(it){
  const b=[];
  if(it.kind==="session")b.push(`<span class="badge b-live">RUNNING</span>`);
  if((it.trigger||"").startsWith("cron"))b.push(`<span class="badge b-cron">CRON · ${esc(it.human||"")}</span>`);
  if(it.spawns)b.push(`<span class="badge b-spawn">SPAWNS · ${esc(it.spawns)}</span>`);
  if(/Remote-control/i.test(it.role||""))b.push(`<span class="badge b-inf">INFRASTRUCTURE</span>`);
  return b.join(" ");
}
function procCard(p){
  const meta=[`running ${dur(p.runtime_s)}`,`${p.rss_mb} MB`,`pid ${p.pid}`];
  if(p.tokens)meta.push(`${num(p.tokens.input)} in / ${num(p.tokens.output)} out tokens`);
  if(p.child_count)meta.push(`${p.child_count} child${p.child_count>1?"ren":""}`);
  return `<div class="card sub">
    <div class="row"><span class="name">${esc(p.label)}</span>
      <span class="role">${esc(p.tool)}</span>
      <span class="badge b-sub">SUBAGENT</span></div>
    <div class="meta">${meta.join("<span>·</span>")}</div>
    <div class="acts"><button class="danger" onclick="kill('${esc(p.id)}','${esc(p.label)}')">Kill</button></div>
  </div>`;
}
function card(it){
  const a=[];
  if(it.can_prompt)a.push(`<button onclick="openTerm('${esc(it.id)}','${esc(it.name)}','${esc(it.role||"")}')">Remote control</button>`);
  if(it.can_kill)a.push(`<button class="danger" onclick="kill('${esc(it.id)}','${esc(it.name)}')">Kill</button>`);
  const m=[];
  if(it.runtime_s!=null)m.push(`running ${dur(it.runtime_s)}`);
  if(it.socket)m.push(`socket ${esc(it.socket)}`);
  if(it.schedule)m.push(`<code>${esc(it.schedule)}</code>`);
  return `<div class="card">
    <div class="row"><span class="name">${esc(it.name)}</span>
      <span class="role">${esc(it.role||"")}</span> ${badges(it)}</div>
    ${it.desc?`<div class="desc">${esc(it.desc)}</div>`:""}
    ${m.length?`<div class="meta">${m.join("<span>·</span>")}</div>`:""}
    ${a.length?`<div class="acts">${a.join("")}</div>`:""}</div>`;
}

function deptBlocks(list){
  const by={};for(const i of list)(by[i.dept||"Unassigned"]??=[]).push(i);
  let h="";
  for(const d of DEPTS){
    const L=by[d];if(!L||!L.length)continue;
    h+=`<div class="dept">${esc(d)} · ${L.length}</div>`;
    for(const i of L.filter(x=>x.kind==="session"||x.kind==="agent"))h+=card(i);
    for(const i of L.filter(x=>!(x.kind==="session"||x.kind==="agent")))h+=card(i);
  }
  return h;
}
function renderList(){
  const list=items();
  if(HOSTS){
    let h="";
    for(const [key,label] of Object.entries(DATA.hosts||{})){
      const L=list.filter(i=>(i.host||"sandy")===key);
      if(!L.length)continue;
      h+=`<div class="hostbox ${key==="laptop"?"laptop":""}"><div class="hh">${esc(label)} · ${L.length}</div>`
        +deptBlocks(L)+`</div>`;
    }
    if(SUBS)h+=procBlock();
    document.getElementById("out").innerHTML=h||`<div class="empty">Nothing found.</div>`;
    return;
  }
  const by={};
  for(const i of list)(by[i.dept||"Unassigned"]??=[]).push(i);
  let h="";
  for(const d of DEPTS){
    const L=by[d];if(!L||!L.length)continue;
    h+=`<div class="dept">${esc(d)} · ${L.length}</div>`;
    for(const i of L.filter(x=>x.kind==="session"))h+=card(i);
    for(const i of L.filter(x=>x.kind!=="session"))h+=card(i);
  }
  if(SUBS)h+=procBlock();
  document.getElementById("out").innerHTML=h||`<div class="empty">Nothing found.</div>`;
}
function procBlock(){
  let h="";
  {
    const procs=(DATA.processes||[]);
    const subs=procs.filter(p=>p.is_subagent), roots=procs.filter(p=>!p.is_subagent);
    h+=`<div class="dept">Live processes · ${procs.length} (${subs.length} subagents)</div>`;
    for(const r of roots){
      h+=card({name:r.label,role:r.tool,kind:"proc",desc:r.cmd,
               runtime_s:r.runtime_s,can_kill:true,can_prompt:false,id:r.id});
      for(const cid of r.children||[]){
        const c=procs.find(x=>x.pid===cid); if(c)h+=procCard(c);
      }
    }
    const orphans=subs.filter(s=>!roots.some(r=>(r.children||[]).includes(s.pid)));
    for(const o of orphans)h+=procCard(o);
  }
  return h;
}

function node(title,role,badgeHtml,cls){
  return `<div class="node ${cls||""}"><div class="nt">${esc(title)}</div>
    <div class="nr">${esc(role||"")}</div>
    ${badgeHtml?`<div class="nb">${badgeHtml}</div>`:""}</div>`;
}
function renderChart(){
  const all=items();
  const el=document.getElementById("chart");
  if(HOSTS){
    let h="";
    for(const [key,label] of Object.entries(DATA.hosts||{})){
      const L=all.filter(i=>(i.host||"sandy")===key);
      if(!L.length)continue;
      h+=`<div class="hostbox ${key==="laptop"?"laptop":""}"><div class="hh">${esc(label)}</div>`
        +chartFor(L)+`</div>`;
    }
    el.innerHTML=h;
  }else{
    el.innerHTML=chartFor(all);
  }
  busify();
}
function leaf(it){
  let h=`<div class="leaf">${node(it.name,it.role,badges(it))}`;
  if(SUBS&&it.kind==="session"){
    const kids=(DATA.processes||[]).filter(p=>p.is_subagent);
    if(kids.length&&/Remote-control hub/i.test(it.role||"")){
      h+=`<div class="stack">`;
      for(const k of kids)
        h+=`<div class="leaf">${node(k.label,`${k.tool} · ${dur(k.runtime_s)}`,
             `<span class="badge b-sub">SUBAGENT</span>`)}</div>`;
      h+=`</div>`;
    }
  }
  return h+`</div>`;
}
function chartFor(list){
  const by={};for(const i of list)(by[i.dept||"Unassigned"]??=[]).push(i);
  const depts=DEPTS.filter(d=>by[d]&&by[d].length);
  let h=`<div class="tree">${node("Florian","owner","","root")}<div class="vline"></div><div class="cols">`;
  for(const d of depts){
    const L=by[d];
    h+=`<div class="col">${node(d,`${L.length} unit${L.length>1?"s":""}`,"","root chead")}`
      +`<div class="stack">`;
    for(const it of L)h+=leaf(it);
    h+=`</div></div>`;
  }
  return h+`</div></div>`;
}
// Die waagerechte Sammelschiene wird aus je einem Segment pro Spalte gebaut.
// Wo das Grid umbricht, weiss nur der Layout-Engine — also nach dem Rendern
// messen, welche Spalten in derselben Reihe sitzen.
function busify(){
  for(const cols of document.querySelectorAll("#chart .cols")){
    const kids=[...cols.children];
    for(const k of kids)k.classList.remove("rowstart","rowend","alone","norail");
    const rows=new Map();
    for(const k of kids){const t=k.offsetTop;if(!rows.has(t))rows.set(t,[]);rows.get(t).push(k)}
    let first=true;
    for(const r of rows.values()){
      if(!first){for(const k of r)k.classList.add("norail");continue}
      first=false;
      if(r.length===1)r[0].classList.add("alone");
      else{r[0].classList.add("rowstart");r[r.length-1].classList.add("rowend")}
    }
  }
}
addEventListener("resize",()=>{if(VIEW==="chart")busify()});
function render(){
  if(!DATA)return;
  document.getElementById("out").hidden=(VIEW!=="list");
  document.getElementById("chart").hidden=(VIEW!=="chart");
  if(VIEW==="list")renderList();else renderChart();
  const p=(DATA.processes||[]).length, s=(DATA.processes||[]).filter(x=>x.is_subagent).length;
  document.getElementById("stamp").textContent=
    `${items().length} units · ${p} processes (${s} subagents) · ${new Date(DATA.generated_at*1000).toLocaleTimeString("en-GB")}`;
}
async function api(path,opts){
  const r=await fetch(path,Object.assign({headers:{"X-Org-Token":TOKEN,
    "Content-Type":"application/json"}},opts||{}));return r.json()}
async function kill(id,name){
  if(!confirm(`Kill "${name}"?\n\nIts transcript is archived first.`))return;
  const r=await api("/api/kill",{method:"POST",body:JSON.stringify({id})});
  alert(r.ok?`Killed.${r.archived_lines?` ${r.archived_lines} lines archived.`:""}`:`Failed: ${r.error||"?"}`);
}
async function sendPrompt(id){
  const el=document.getElementById("p_"+id),text=el.value.trim();if(!text)return;
  const r=await api("/api/prompt",{method:"POST",body:JSON.stringify({id,text})});
  if(r.ok){el.value="";alert("Sent.")}else alert("Failed: "+(r.error||"?"))}
document.getElementById("t-sub").textContent=SUBS?"Hide subagents":"Show subagents";
document.getElementById("t-sub").classList.toggle("on",SUBS);
document.getElementById("t-rt").textContent="Live: "+(RT?"on":"off");
document.getElementById("t-rt").classList.toggle("on",RT);
document.getElementById("t-host").classList.toggle("on",HOSTS);
setView(VIEW);connect();
</script></body></html>
