# Die Agentenzentrale laeuft als systemd-Dienst auf dem HOST, nicht hier drin:
# sie braucht Zugriff auf die tmux-Sockets, die Prozessliste und die crontab,
# und nichts davon ist aus einem Container heraus sichtbar. Dieser Container
# reicht nur durch und besorgt die oeffentliche Adresse samt TLS ueber Traefik.
server {
  listen 80;
  resolver 127.0.0.11 valid=10s;
  location /healthz { return 200 "ok"; add_header Content-Type text/plain; }
  # 172.30.1.1 ist das Gateway des coolify-Netzes, in dem dieser Container haengt.
  # 172.17.0.1 (Docker-Standard) existiert auf dieser Maschine NICHT — docker0 liegt
  # hier auf 172.30.0.1. Deshalb die gemessene Adresse statt der ueblichen Annahme.
  # SSE darf nicht gepuffert werden, sonst kommt nie ein Ereignis an
  location /api/stream {
    proxy_pass http://172.30.1.1:8899;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
  }
  location / {
    proxy_pass http://172.30.1.1:8899;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
